async function send(messageText) {
    if (!messageText) return;
    const myId = localStorage.getItem("lizchat_username") || "Аноним";
    if (!o) return;
    const chatKey = "chat-" + o;
    let seenIds = new Set(JSON.parse(localStorage.getItem(chatKey + "-seen") || "[]"));
    const el = document.createElement("div");
    el.className = "message";
    el.textContent = messageText;
    chat.appendChild(el);
    el.scrollIntoView({ behavior: "smooth" });
    localStorage.setItem(chatKey, chat.innerHTML);
    try {
        const tempId = "temp-" + Date.now() + "-" + Math.random();
        seenIds.add(tempId);
        localStorage.setItem(chatKey + "-seen", JSON.stringify([...seenIds]));
        const docRef = await db.collection("chats").doc(o).collection("messages").add({
            text: messageText,
            sender: myId,
            timestamp: new Date()
        });
        seenIds.delete(tempId);
        seenIds.add(docRef.id);
        localStorage.setItem(chatKey + "-seen", JSON.stringify([...seenIds]));
        console.log("Ошибок в отправке нет.");
    } catch (error) {
        console.error("Ошибка:", error);
    }
    document.getElementById("mail-input").value = "";
}

// слушать 
function listenChat(chatId) {
    const myId = localStorage.getItem("lizchat_username") || "Аноним";
    const chatKey = "chat-" + chatId;
    let seenIds = new Set(JSON.parse(localStorage.getItem(chatKey + "-seen") || "[]"));
    db.collection("chats").doc(chatId).collection("messages")
      .orderBy("timestamp")
      .onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
            if (change.type !== "added") return;
            const docId = change.doc.id;
            if (seenIds.has(docId)) return;
            seenIds.add(docId);
            localStorage.setItem(chatKey + "-seen", JSON.stringify([...seenIds]));
            const data = change.doc.data();
            if (data.sender === myId) return; 
            const el = document.createElement("div");
            el.className = "m"; 
            el.textContent = data.sender + ": " + data.text;
            chat.appendChild(el);
            el.scrollIntoView({ behavior: "smooth" });
        });
    });
}
// обработка количества 
function formatlikes(num) {
    const units = ['', 'K', 'M', 'B', 'T'];
    let unitIndex = 0;
    
    while (Math.abs(num) >= 1000 && unitIndex < units.length - 1) {
        num /= 1000;
        unitIndex++;
    }
    
    return num.toFixed(1).replace(/\.0$/, '') + units[unitIndex];
}

function convertToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}
